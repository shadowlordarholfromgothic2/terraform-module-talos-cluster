name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Releases are serialised: cancelling one mid-tag would leave the manifest and
# the git tags disagreeing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR that accumulates CHANGELOG.md entries from the
      # conventional-commit subjects on main. Merging that PR tags the release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
